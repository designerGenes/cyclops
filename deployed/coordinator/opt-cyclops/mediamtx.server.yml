# Central MediaMTX on the Pi 5. Paths are added at runtime by Cyclops
# (one proxy per registered eye); browsers play them via WebRTC/WHEP
# on :8889. HLS on :8888 is kept as a fallback player.
logLevel: info
api: yes
apiAddress: 127.0.0.1:9997

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

webrtc: yes
webrtcAddress: :8889
webrtcHandshakeTimeout: 10s
webrtcTrackGatherTimeout: 2s
webrtcSTUNGatherTimeout: 5s
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts: [cyclops]

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 7

rtmp: no
srt: no
playback: no

paths: {}
